spring.application.name=demo

spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.base-url=https://api.groq.com/openai/v1

spring.ai.openai.chat.max-tokens=500
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.chat.model=qwen/qwen3.8-27b


spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_support_agent}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092

resilience4j.timelimiter.instances.externalService.timeout-duration=2s

resilience4j.retry.instances.externalService.max-attempts=3
resilience4j.retry.instances.externalService.wait-duration=1s

resilience4j.circuitbreaker.instances.externalService.sliding-window-size=5
resilience4j.circuitbreaker.instances.externalService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.externalService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.externalService.wait-duration-in-open-state=10s

# Rate Limiter
resilience4j.ratelimiter.instances.chatApi.limit-for-period=5
resilience4j.ratelimiter.instances.chatApi.limit-refresh-period=10s
resilience4j.ratelimiter.instances.chatApi.timeout-duration=0

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId} spanId=%X{spanId}] %logger{36} - %msg%n

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=support-agent
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.kafka.TicketCreatedEvent